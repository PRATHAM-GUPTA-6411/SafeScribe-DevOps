AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  SafeScribe-DevOps network: a VPC with two public subnets in two Availability Zones, an internet gateway,
  a route table and security groups. No NAT gateway (it bills every hour), no private subnets, no SSH access.

Parameters:
  ProjectName:
    Type: String
    Default: safescribe
    AllowedPattern: "^[a-z][a-z0-9-]{1,20}$"
    ConstraintDescription: Lower-case letters, digits and hyphens, starting with a letter.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetACidr:
    Type: String
    Default: 10.0.1.0/24
  PublicSubnetBCidr:
    Type: String
    Default: 10.0.2.0/24
  AdminCidr:
    Type: String
    Default: ""
    AllowedPattern: "^$|^([0-9]{1,3}\\.){3}[0-9]{1,3}/32$"
    ConstraintDescription: Leave empty, or give one address such as 203.0.113.7/32.
    Description: >-
      Optional. Your public IP as x.x.x.x/32 to reach Grafana (3000) and Prometheus (9090) on the monitoring
      instance. Empty means no inbound access to the monitoring instance at all.

Conditions:
  HasAdminCidr: !Not [!Equals [!Ref AdminCidr, ""]]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-vpc" }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-igw" }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetACidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-public-a" }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnetBCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-public-b" }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-public-rt" }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetAAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # ---- Security groups ----

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Load balancer. Web traffic from the internet (443, and 80 which only redirects to 443)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS from the internet }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP (redirected to HTTPS) }
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-alb-sg" }

  MonitoringSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Prometheus and Grafana instance. No inbound access unless AdminCidr is set
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-monitoring-sg" }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application instances. Only the load balancer and the monitoring instance can connect
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "${ProjectName}-app-sg" }

  AppFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      SourceSecurityGroupId: !Ref AlbSecurityGroup
      Description: App traffic from the load balancer only

  AppMetricsFromMonitoring:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 9464
      ToPort: 9464
      SourceSecurityGroupId: !Ref MonitoringSecurityGroup
      Description: Application metrics, scraped by Prometheus only

  AppNodeExporterFromMonitoring:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 9100
      ToPort: 9100
      SourceSecurityGroupId: !Ref MonitoringSecurityGroup
      Description: Host metrics (node exporter), scraped by Prometheus only

  MonitoringGrafanaFromAdmin:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAdminCidr
    Properties:
      GroupId: !Ref MonitoringSecurityGroup
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      CidrIp: !Ref AdminCidr
      Description: Grafana, from the admin address only

  MonitoringPrometheusFromAdmin:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasAdminCidr
    Properties:
      GroupId: !Ref MonitoringSecurityGroup
      IpProtocol: tcp
      FromPort: 9090
      ToPort: 9090
      CidrIp: !Ref AdminCidr
      Description: Prometheus, from the admin address only

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "${AWS::StackName}-VpcId" }
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export: { Name: !Sub "${AWS::StackName}-PublicSubnetIds" }
  AlbSecurityGroupId:
    Value: !GetAtt AlbSecurityGroup.GroupId
    Export: { Name: !Sub "${AWS::StackName}-AlbSecurityGroupId" }
  AppSecurityGroupId:
    Value: !GetAtt AppSecurityGroup.GroupId
    Export: { Name: !Sub "${AWS::StackName}-AppSecurityGroupId" }
  MonitoringSecurityGroupId:
    Value: !GetAtt MonitoringSecurityGroup.GroupId
    Export: { Name: !Sub "${AWS::StackName}-MonitoringSecurityGroupId" }
