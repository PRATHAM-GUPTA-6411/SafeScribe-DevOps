name: CI

# Runs on every pull request and on every push to main. Read-only token, no secrets, no AWS access.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
      - name: Lint
        run: npm run lint
      - name: Frontend tests
        run: npm run test:frontend
      - name: Backend tests (API, auth, DynamoDB code, server boot, UI end-to-end)
        run: npm run test:backend
      - name: Dependency audit (production dependencies, high severity and above)
        run: npm audit --omit=dev --audit-level=high --prefix backend

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      IMAGE: safescribe-api:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install hadolint (pinned, checksum verified)
        run: |
          curl -fsSL -o hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  hadolint" | sha256sum -c -
          chmod +x hadolint
      - name: Lint Dockerfiles
        run: ./hadolint Dockerfile docker/dynalite/Dockerfile
      - name: Validate docker-compose.yml
        env:
          COGNITO_USER_POOL_ID: us-east-1_CiCheck
          COGNITO_CLIENT_ID: ci-check
          COGNITO_DOMAIN: https://ci-check.auth.us-east-1.amazoncognito.com
        run: docker compose config --quiet
      - name: Build API image (version = commit SHA)
        run: docker build --build-arg APP_VERSION="$GITHUB_SHA" --build-arg GIT_SHA="$GITHUB_SHA" -t "$IMAGE" .
      - name: Build local DynamoDB emulator image
        run: docker build -t safescribe-local-dynamodb:ci docker/dynalite
      - name: Smoke test the API image
        run: bash scripts/ci-smoke-test.sh "$IMAGE" "$GITHUB_SHA"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan git history for secrets
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .

  infra:
    name: Validate workflows and CloudFormation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum verified)
        run: |
          curl -fsSL -o actionlint.tgz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar xzf actionlint.tgz actionlint
      - name: Lint GitHub Actions workflows
        run: ./actionlint -color
      - name: Validate CloudFormation templates (cfn-lint)
        run: |
          shopt -s globstar nullglob
          files=(infrastructure/**/*.yaml infrastructure/**/*.yml)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No CloudFormation templates in infrastructure/ yet: nothing to validate."
            exit 0
          fi
          python3 -m venv "$RUNNER_TEMP/cfn-venv"
          "$RUNNER_TEMP/cfn-venv/bin/pip" install --quiet cfn-lint==1.58.0
          "$RUNNER_TEMP/cfn-venv/bin/cfn-lint" "${files[@]}"
